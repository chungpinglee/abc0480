    <!-- FontAwesome Icons -->

    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #0b0f19;
            min-height: 100vh;
            color: #f1f5f9;
            overflow-x: hidden;
        }

        /* 太空背景 Canvas 置底 */
        #space-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
        }

        /* 標題與文字 Hover 效果：放大 10% 且變純白色 */
        .hover-text-effect {
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), color 0.25s ease;
            display: inline-block;
        }
        .hover-text-effect:hover {
            transform: scale(1.1);
            color: #ffffff !important;
        }

        /* 當按鈕文字為「備用」時，文字顏色與螢幕背景相同 (#0b0f19) */
        .btn-backup-text {
            color: #0b0f19 !important;
        }
        .action-btn:hover .btn-backup-text {
            color: #0b0f19 !important;
        }

        /* 頂部按鈕 Hover 效果：文字紅色放大10%、背景白色 */
        .top-nav-btn {
            transition: all 0.25s ease;
        }
        .top-nav-btn:hover {
            background-color: #ffffff !important;
            border-color: #ffffff !important;
        }
        .top-nav-btn:hover .top-nav-text,
        .top-nav-btn:hover i {
            color: #ef4444 !important;
            transform: scale(1.1);
        }

        /* 其它功能按鈕 Hover 效果：背景橙色、外框白色、文字放大 10% */
        .action-btn {
            transition: background-color 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
            transform: none !important;
        }
        .action-btn:hover {
            background: #f97316 !important;
            border-color: #ffffff !important;
            box-shadow: 0 8px 20px -4px rgba(249, 115, 22, 0.5);
            animation: none !important;
            transform: none !important;
        }
        .action-btn:hover .btn-text-content:not(.btn-backup-text) {
            transform: scale(1.1);
            color: #ffffff !important;
        }

        /* 6x6 矩陣選取器格子樣式 */
        .matrix-cell {
            aspect-ratio: 1;
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 6px;
            background-color: rgba(15, 23, 42, 0.6);
            transition: all 0.15s ease;
            cursor: pointer;
        }
        .matrix-cell.active {
            background-color: #ffffff !important;
            border-color: #ffffff !important;
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.8);
        }
        .matrix-cell.hovered {
            background-color: rgba(255, 255, 255, 0.85);
            border-color: #ffffff;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
        }

        /* 自訂滾動條 */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0b0f19;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
    </style>

<script>
                    const canvas = document.getElementById('space-bg');
                    const ctx = canvas.getContext('2d');
                    let width, height;
                    let stars = [], meteors = [], spaceVehicles = [];

                    function resizeCanvas() {
                        width = canvas.width = window.innerWidth;
                        height = canvas.height = window.innerHeight;
                        stars = [];
                        const count = Math.floor((width * height) / 3000);
                        for (let i = 0; i < count; i++) {
                            stars.push({
                                x: Math.random() * width,
                                y: Math.random() * height,
                                radius: Math.random() * 1.5,
                                alpha: Math.random(),
                                speed: Math.random() * 0.01 + 0.003
                            });
                        }
                    }

                    window.addEventListener('resize', resizeCanvas);

                    setInterval(() => {
                        meteors.push({
                            x: Math.random() * width,
                            y: -10,
                            length: Math.random() * 80 + 50,
                            speedX: (Math.random() - 0.5) * 3.6,
                            speedY: (Math.random() * 7.2 + 5.4),
                            size: Math.random() * 1.5 + 1,
                            alpha: 1
                        });
                    }, 2000);

                    setInterval(() => {
                        const isLeftToRight = Math.random() > 0.5;
                        const type = Math.random() > 0.5 ? 'satellite' : 'spaceship';
                        spaceVehicles.push({
                            x: isLeftToRight ? -60 : width + 60,
                            y: Math.random() * (height * 0.7) + height * 0.1,
                            speed: isLeftToRight ? (Math.random() * 1.5 + 1) : -(Math.random() * 1.5 + 1),
                            type: type,
                            scale: Math.random() * 0.4 + 0.8,
                            blink: 0
                        });
                    }, 3000);

                    function drawSpace() {
                        ctx.clearRect(0, 0, width, height);
                        ctx.fillStyle = '#ffffff';
                        stars.forEach(star => {
                            star.alpha += star.speed;
                            if (star.alpha > 1 || star.alpha < 0) star.speed = -star.speed;
                            ctx.globalAlpha = Math.max(0, star.alpha);
                            ctx.beginPath();
                            ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                            ctx.fill();
                        });

                        meteors.forEach((m, index) => {
                            m.x += m.speedX;
                            m.y += m.speedY;
                            m.alpha -= 0.008;
                            ctx.globalAlpha = Math.max(0, m.alpha);
                            const gradient = ctx.createLinearGradient(m.x, m.y, m.x - m.speedX * 8, m.y - m.speedY * 8);
                            gradient.addColorStop(0, '#ffffff');
                            gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
                            ctx.strokeStyle = gradient;
                            ctx.lineWidth = m.size;
                            ctx.beginPath();
                            ctx.moveTo(m.x, m.y);
                            ctx.lineTo(m.x - m.speedX * 6, m.y - m.speedY * 6);
                            ctx.stroke();
                            if (m.y > height + 100 || m.alpha <= 0) meteors.splice(index, 1);
                        });

                        spaceVehicles.forEach((v, index) => {
                            v.x += v.speed;
                            v.blink += 0.05;
                            ctx.save();
                            ctx.translate(v.x, v.y);
                            ctx.scale(v.scale, v.scale);
                            ctx.globalAlpha = 0.9;
                            if (v.type === 'satellite') {
                                ctx.fillStyle = '#94a3b8';
                                ctx.fillRect(-10, -5, 20, 10);
                                ctx.fillStyle = '#38bdf8';
                                ctx.fillRect(-30, -3, 16, 6);
                                ctx.fillRect(14, -3, 16, 6);
                                if (Math.sin(v.blink) > 0) {
                                    ctx.fillStyle = '#ef4444';
                                    ctx.beginPath();
                                    ctx.arc(0, -6, 2, 0, Math.PI * 2);
                                    ctx.fill();
                                }
                            } else {
                                ctx.fillStyle = '#cbd5e1';
                                ctx.beginPath();
                                if (v.speed > 0) {
                                    ctx.moveTo(15, 0); ctx.lineTo(-12, -8); ctx.lineTo(-8, 0); ctx.lineTo(-12, 8);
                                } else {
                                    ctx.moveTo(-15, 0); ctx.lineTo(12, -8); ctx.lineTo(8, 0); ctx.lineTo(12, 8);
                                }
                                ctx.closePath();
                                ctx.fill();
                                ctx.fillStyle = '#f97316';
                                ctx.beginPath();
                                const flameX = v.speed > 0 ? -12 : 12;
                                ctx.arc(flameX, 0, 3 + Math.sin(v.blink * 2) * 1.5, 0, Math.PI * 2);
                                ctx.fill();
                            }
                            ctx.restore();
                            if ((v.speed > 0 && v.x > width + 100) || (v.speed < 0 && v.x < -100)) spaceVehicles.splice(index, 1);
                        });

                        ctx.globalAlpha = 1;
                        requestAnimationFrame(drawSpace);
                    }

                    window.onload = function() {
                        resizeCanvas();
                        drawSpace();
                    };
                </script></body></html>
