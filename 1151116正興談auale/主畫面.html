<!DOCTYPE html>
<html lang="zh-Hant">
<head>

  <style>
    :root {
      --bg-paper: #FAF7F2;
      --bg-card: #FFFFFF;
      --bg-sage-soft: #EEF3EC;
      --bg-amber-soft: #F9EFE4;
      --text-ink: #2B332E;
      --text-muted: #647068;
      --sage-primary: #3A5A40;
      --sage-mid: #588157;
      --sage-light: #A3B18A;
      --amber-accent: #C87D55;
      --border-warm: #E6DFD3;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Noto Sans TC', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-paper);
      color: var(--text-ink);
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .font-serif-tc {
      font-family: 'Noto Serif TC', Georgia, serif;
    }

    .font-num {
      font-family: 'Inter', 'Noto Sans TC', sans-serif;
    }

    /* Subtle organic paper background blobs */
    .ambient-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .blob-1 {
      position: absolute;
      top: -12%;
      right: -8%;
      width: 520px;
      height: 520px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(163, 177, 138, 0.22) 0%, rgba(250, 247, 242, 0) 70%);
      animation: breathe 14s ease-in-out infinite;
    }

    .blob-2 {
      position: absolute;
      bottom: -15%;
      left: -10%;
      width: 560px;
      height: 560px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(212, 163, 115, 0.18) 0%, rgba(250, 247, 242, 0) 70%);
      animation: breathe 18s ease-in-out infinite reverse;
    }

    @keyframes breathe {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(18px, -14px) scale(1.06); }
    }

    /* Entrance & Transition Animations */
    @keyframes fadeSlideUp {
      0% {
        opacity: 0;
        transform: translateY(22px) scale(0.985);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes fadeSlideRight {
      0% {
        opacity: 0;
        transform: translateX(-20px);
      }
      100% {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes zoomPop {
      0% {
        opacity: 0;
        transform: scale(0.94) translateY(14px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    @keyframes thinkingPulse {
      0% {
        opacity: 0;
        transform: scale(0.96);
      }
      35% {
        opacity: 1;
        transform: scale(1);
      }
      75% {
        opacity: 1;
        transform: scale(1);
      }
      100% {
        opacity: 0;
        transform: scale(1.03);
      }
    }

    .anim-up {
      opacity: 0;
      animation: fadeSlideUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .anim-right {
      opacity: 0;
      animation: fadeSlideRight 0.55s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .anim-pop {
      opacity: 0;
      animation: zoomPop 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .delay-1 { animation-delay: 0.06s; }
    .delay-2 { animation-delay: 0.14s; }
    .delay-3 { animation-delay: 0.22s; }
    .delay-4 { animation-delay: 0.30s; }
    .delay-5 { animation-delay: 0.38s; }
    .delay-6 { animation-delay: 0.46s; }

    /* Interactive Card Styles */
    .literary-card {
      background: var(--bg-card);
      border: 1px solid var(--border-warm);
      box-shadow: 0 10px 30px -10px rgba(43, 51, 46, 0.07);
      transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1),
                  box-shadow 0.32s cubic-bezier(0.22, 1, 0.36, 1),
                  border-color 0.32s ease;
    }

    .literary-card-hover:hover {
      transform: translateY(-4px) scale(1.008);
      box-shadow: 0 18px 38px -12px rgba(58, 90, 64, 0.16);
      border-color: var(--sage-light);
    }

    .literary-card-hover:active {
      transform: translateY(-1px) scale(0.995);
    }

    .hub-thinking-card {
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1),
                  box-shadow 0.28s cubic-bezier(0.22, 1, 0.36, 1),
                  border-color 0.28s ease,
                  background-color 0.28s ease;
    }

    .hub-thinking-card:hover {
      background: linear-gradient(135deg, #FDE2DC 0%, #FFF3BF 100%);
      border-color: #2E7D32;
      box-shadow: 0 0 0 2px #2E7D32, 0 18px 38px -12px rgba(46, 125, 50, 0.22);
    }

    .hub-thinking-text {
      display: inline-block;
      transform-origin: left center;
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1), color 0.28s ease;
    }

    .hub-thinking-card:hover .hub-thinking-text {
      transform: scale(1.05);
      color: #1B5E20;
    }

    .overview-focus-card {
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1),
                  box-shadow 0.28s cubic-bezier(0.22, 1, 0.36, 1),
                  border-color 0.28s ease,
                  background 0.28s ease;
    }

    .overview-focus-card:hover {
      background: linear-gradient(135deg, #F39C12 0%, #D9381E 100%);
      border-color: #D9381E;
      box-shadow: 0 16px 34px -10px rgba(217, 56, 30, 0.32);
    }

    .overview-focus-text {
      display: inline-block;
      transform-origin: left center;
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1), color 0.28s ease;
    }

    .overview-focus-card:hover .overview-focus-text,
    .overview-focus-card:hover .overview-focus-meta {
      color: #FFFFFF;
    }

    .overview-focus-card:hover .overview-focus-text {
      transform: scale(1.05);
    }

    /* Section Transition Curtain */
    #transition-curtain {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(250, 247, 242, 0.92);
      backdrop-filter: blur(10px);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.28s ease;
    }

    #transition-curtain.active {
      opacity: 1;
      pointer-events: auto;
    }

    .curtain-badge {
      animation: zoomPop 0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #D4CCC0;
      border-radius: 999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #B8AE9F;
    }
  </style>
</head>

    // =========================================================================
    // Application State & Navigation
    // =========================================================================
    let currentSlideNum = 1;
    let isTransitioning = false;
    let chartScenario = 'compare';
    let isChartOpen = false;
    let visitHistory = [{ type: 'slide', num: 1 }];
    let historyIndex = 0;

    function recordVisit(entry) {
      const cur = visitHistory[historyIndex];
      if (cur && cur.type === entry.type && cur.num === entry.num) return;
      if (historyIndex < visitHistory.length - 1) {
        visitHistory = visitHistory.slice(0, historyIndex + 1);
      }
      visitHistory.push(entry);
      historyIndex = visitHistory.length - 1;
    }

    function navigateHistory(delta) {
      const nextIdx = historyIndex + delta;
      if (nextIdx < 0 || nextIdx >= visitHistory.length) return;
      historyIndex = nextIdx;
      const target = visitHistory[historyIndex];
      if (target.type === 'chart') {
        currentSlideNum = target.num;
        isChartOpen = true;
        renderHeaderAndFooter(getSlide(currentSlideNum));
        renderInheritanceChartPage(chartScenario, false);
      } else if (target.type === 'cashflow') {
        currentSlideNum = target.num;
        isChartOpen = true;
        renderHeaderAndFooter(getSlide(currentSlideNum));
        renderCashflowDiagramPage(false);
      } else {
        isChartOpen = false;
        goToSlide(target.num, true, false);
      }
    }

    const stageEl = document.getElementById('slide-stage');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');
    const headerPageBadge = document.getElementById('header-page-badge');
    const flowDotsEl = document.getElementById('flow-dots');
    const progressBarEl = document.getElementById('progress-bar');
    const footerContextEl = document.getElementById('footer-context-actions');
    const curtainEl = document.getElementById('transition-curtain');
    const curtainContentEl = document.getElementById('curtain-content');
    const tocModal = document.getElementById('toc-modal');
    const tocList = document.getElementById('toc-list');
    const btnToc = document.getElementById('btn-toc');
    const btnCloseToc = document.getElementById('btn-close-toc');
    const btnFullscreen = document.getElementById('btn-fullscreen');
    const iconFsEnter = document.getElementById('icon-fs-enter');
    const iconFsExit = document.getElementById('icon-fs-exit');

    function getSlide(num) {
      return SLIDES.find(s => s.num === num) || SLIDES[0];
    }

    function getGroup(groupId) {
      return THINKING_GROUPS.find(g => g.id === groupId) || null;
    }

    // Smooth animated transition when entering a Thinking Direction
    function enterThinkingGroup(groupId, targetSlide = null) {
      if (isTransitioning) return;
      const group = getGroup(groupId);
      if (!group) return;

      isTransitioning = true;
      const dest = targetSlide || group.startSlide;

      curtainContentEl.innerHTML = `
        <div class="curtain-badge inline-flex flex-col items-center">
          <span class="font-num text-xs font-bold tracking-[0.22em] px-4 py-1.5 rounded-full mb-3"
                style="background:${group.softBg}; color:${group.accent}; border: 1px solid ${group.accent}30;">
            ${group.tag}
          </span>
          <h2 class="font-serif-tc text-2xl sm:text-3xl font-bold text-[#2B332E] leading-snug">
            ${group.shortTitle}
          </h2>
          <p class="mt-2 text-sm text-[#647068]">正在進入簡報流程（第 ${group.startSlide}–${group.endSlide} 頁）</p>
        </div>
      `;

      curtainEl.classList.add('active');

      setTimeout(() => {
        isChartOpen = false;
        currentSlideNum = dest;
        recordVisit({ type: 'slide', num: dest });
        renderSlide();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }, 280);

      setTimeout(() => {
        curtainEl.classList.remove('active');
        isTransitioning = false;
      }, 620);
    }

    function goToSlide(num, useQuickFade = true, shouldRecord = true) {
      if (num < 1 || num > 25) return;
      if (num === currentSlideNum && !isChartOpen) return;

      if (shouldRecord) {
        recordVisit({ type: 'slide', num });
      }
      isChartOpen = false;

      if (useQuickFade) {
        stageEl.style.opacity = '0';
        stageEl.style.transform = 'translateY(8px)';
        stageEl.style.transition = 'opacity 0.16s ease, transform 0.16s ease';
        setTimeout(() => {
          currentSlideNum = num;
          renderSlide();
          stageEl.style.opacity = '1';
          stageEl.style.transform = 'translateY(0)';
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }, 150);
      } else {
        currentSlideNum = num;
        renderSlide();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function renderHeaderAndFooter(slide) {
      headerPageBadge.textContent = slide.pageLabel;
      progressBarEl.style.width = `${(slide.num / 25) * 100}%`;

      const group = getGroup(slide.groupId);
      if (group) {
        // Render step dots for current thinking direction
        flowDotsEl.innerHTML = group.slides.map((sNum, idx) => {
          const isActive = sNum === slide.num;
          return `

              </span>
              <div class="min-w-0">
                <div class="text-[11px] font-semibold text-[#588157] truncate">${escapeHtml(s.eyebrow)}</div>
                <div class="text-sm font-semibold text-[#2B332E] truncate">${escapeHtml(s.title)}</div>
              </div>
            </div>
            ${group ? `<span class="hidden sm:inline-block font-num text-[11px] font-semibold px-2 py-0.5 rounded-full shrink-0" style="background:${group.softBg}; color:${group.accent}">${group.tag}</span>` : ''}
          </button>
        `;
      }).join('');
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // Event Delegation for dynamic elements
    document.addEventListener('click', (e) => {
      const groupBtn = e.target.closest('[data-enter-group]');
      if (groupBtn) {
        const gid = Number(groupBtn.getAttribute('data-enter-group'));
        enterThinkingGroup(gid);
        return;
      }

      const jumpBtn = e.target.closest('[data-slide-jump]');
      if (jumpBtn) {
        const num = Number(jumpBtn.getAttribute('data-slide-jump'));
        goToSlide(num);
        return;
      }

      const homeAction = e.target.closest('[data-action="go-home"]');
      if (homeAction) {
        goToSlide(1);
        return;
      }

      const openCashflowBtn = e.target.closest('[data-action="open-cashflow-chart"]');
      if (openCashflowBtn) {
        renderCashflowDiagramPage(true);
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }

      const closeCashflowBtn = e.target.closest('[data-action="close-cashflow-chart"]');
      if (closeCashflowBtn) {
        goToSlide(12, true, true);
        return;
      }

      const openChartBtn = e.target.closest('[data-action="open-inheritance-chart"]');
      if (openChartBtn) {
        renderInheritanceChartPage('compare');
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }

      const closeChartBtn = e.target.closest('[data-action="close-inheritance-chart"]');
      if (closeChartBtn) {
        goToSlide(5, true, true);
        return;
      }

      const chartModeBtn = e.target.closest('[data-chart-mode]');
      if (chartModeBtn) {
        const mode = chartModeBtn.getAttribute('data-chart-mode');
        renderInheritanceChartPage(mode, false);
        return;
      }

      const tocJump = e.target.closest('[data-toc-slide]');
      if (tocJump) {
        const num = Number(tocJump.getAttribute('data-toc-slide'));
        tocModal.classList.add('hidden');
        tocModal.classList.remove('flex');
        goToSlide(num);
      }
    });

    btnPrev.addEventListener('click', () => navigateHistory(-1));
    btnNext.addEventListener('click', () => navigateHistory(1));

    btnToc.addEventListener('click', () => {
      renderToc();
      tocModal.classList.remove('hidden');
      tocModal.classList.add('flex');
    });

    btnCloseToc.addEventListener('click', () => {
      tocModal.classList.add('hidden');
      tocModal.classList.remove('flex');
    });

    tocModal.addEventListener('click', (e) => {
      if (e.target === tocModal) {
        tocModal.classList.add('hidden');
        tocModal.classList.remove('flex');
      }
    });

    btnFullscreen.addEventListener('click', () => {
      try {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen();
        } else {
          document.exitFullscreen();
        }
      } catch (err) {
        // Ignore if fullscreen is blocked by embed container
      }
    });

    document.addEventListener('fullscreenchange', () => {
      const isFs = Boolean(document.fullscreenElement);
      iconFsEnter.classList.toggle('hidden', isFs);
      iconFsExit.classList.toggle('hidden', !isFs);
    });

    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
      if (tocModal.classList.contains('flex')) {
        if (e.key === 'Escape') {
          tocModal.classList.add('hidden');
          tocModal.classList.remove('flex');
        }
        return;
      }

      if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') {
        e.preventDefault();
        navigateHistory(1);
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        e.preventDefault();
        navigateHistory(-1);
      } else if (e.key === 'Escape' || e.key === 'Home' || e.key === '0') {
        e.preventDefault();
        goToSlide(1);
      } else if (['1', '2', '3', '4', '5'].includes(e.key)) {
        e.preventDefault();
        enterThinkingGroup(Number(e.key));
      }
    });

    // =========================================================================
    // Button Customization (Right-Click Edit) & Gear Save-As HTML
    // =========================================================================
    const STORAGE_KEY = 'wealth_transfer_custom_buttons_v1';
    let customButtons = {};
    let editingBtnKey = null;
    let editingDefaultLabel = '';

    function loadCustomButtons() {
      try {
        const embeddedEl = document.getElementById('embedded-button-config');
        const embedded = embeddedEl && embeddedEl.textContent.trim() ? JSON.parse(embeddedEl.textContent) : {};
        const saved = localStorage.getItem(STORAGE_KEY);
        const localData = saved ? JSON.parse(saved) : {};
        customButtons = { ...embedded, ...localData };
      } catch (err) {
        customButtons = {};
      }
    }

    function persistCustomButtons() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(customButtons));
      } catch (err) {
        // Ignore storage restrictions
      }
      const embeddedEl = document.getElementById('embedded-button-config');
      if (embeddedEl) {
        embeddedEl.textContent = JSON.stringify(customButtons);
      }
    }

    function getButtonKey(btn) {
      if (btn.dataset.btnId) return btn.dataset.btnId;
      if (btn.id) return btn.id;
      if (btn.dataset.enterGroup) return `group-${btn.dataset.enterGroup}`;
      if (btn.dataset.slideJump) return `jump-${btn.dataset.slideJump}`;
      if (btn.dataset.action) return `action-${btn.dataset.action}`;
      if (btn.dataset.chartMode) return `chart-${btn.dataset.chartMode}`;
      return `btn-${(btn.innerText || '').trim().slice(0, 24)}`;
    }

    function getButtonLabelSpan(btn) {
      return btn.querySelector('.hub-thinking-text, .overview-focus-text, span:last-of-type, span') || btn;
    }

    function applyCustomButtonsToDOM() {
      document.querySelectorAll('button').forEach((btn) => {
        if (btn.closest('#btn-edit-modal') || btn.id === 'btn-close-toc') return;
        const key = getButtonKey(btn);
        if (!btn.dataset.defaultLabel) {
          const span = getButtonLabelSpan(btn);
          btn.dataset.defaultLabel = (span.textContent || '').trim();
        }
        const cfg = customButtons[key];
        if (cfg) {
          const span = getButtonLabelSpan(btn);
          if (cfg.label && span) {
            span.textContent = cfg.label;
          }
          if (cfg.url) {
            btn.dataset.customUrl = cfg.url;
          } else {
            delete btn.dataset.customUrl;
          }
        }
      });
    }

    function showToast(msg) {
      const toast = document.getElementById('app-toast');
      if (!toast) return;
      toast.textContent = msg;
      toast.classList.remove('hidden');
      clearTimeout(toast._timer);
      toast._timer = setTimeout(() => {
        toast.classList.add('hidden');
      }, 2800);
    }

    const editModal = document.getElementById('btn-edit-modal');
    const editForm = document.getElementById('btn-edit-form');
    const editLabelInput = document.getElementById('edit-btn-label');
    const editUrlInput = document.getElementById('edit-btn-url');
    const btnCloseEdit = document.getElementById('btn-close-edit');
    const btnCancelEdit = document.getElementById('btn-cancel-edit');
    const btnResetEdit = document.getElementById('btn-reset-edit');
    const btnSaveHtml = document.getElementById('btn-save-html');

    function openEditModal(btn) {
      const key = getButtonKey(btn);
      const span = getButtonLabelSpan(btn);
      editingBtnKey = key;
      editingDefaultLabel = btn.dataset.defaultLabel || (span.textContent || '').trim();
      const cfg = customButtons[key] || {};
      editLabelInput.value = cfg.label || editingDefaultLabel;
      editUrlInput.value = cfg.url || '';
      editModal.classList.remove('hidden');
      editModal.classList.add('flex');
      editLabelInput.focus();
    }

    function closeEditModal() {
      editModal.classList.add('hidden');
      editModal.classList.remove('flex');
      editingBtnKey = null;
    }

    document.addEventListener('contextmenu', (e) => {
      const btn = e.target.closest('button');
      if (!btn || btn.closest('#btn-edit-modal') || btn.id === 'btn-close-toc') return;
      e.preventDefault();
      openEditModal(btn);
    });

    editForm.addEventListener('submit', (e) => {
      e.preventDefault();
      if (!editingBtnKey) return;
      const label = editLabelInput.value.trim();
      const url = editUrlInput.value.trim();
      customButtons[editingBtnKey] = {
        label: label || editingDefaultLabel,
        url
      };
      persistCustomButtons();
      renderSlide();
      applyCustomButtonsToDOM();
      closeEditModal();
      showToast('已更新按鈕設定（記得點擊上方齒輪可另存新 HTML 檔案）');
    });

    btnResetEdit.addEventListener('click', () => {
      if (!editingBtnKey) return;
      delete customButtons[editingBtnKey];
      persistCustomButtons();
      renderSlide();
      applyCustomButtonsToDOM();
      closeEditModal();
      showToast('已恢復此按鈕預設值');
    });

    btnCloseEdit.addEventListener('click', closeEditModal);
    btnCancelEdit.addEventListener('click', closeEditModal);
    editModal.addEventListener('click', (e) => {
      if (e.target === editModal) closeEditModal();
    });

    // Capture-phase click handler for buttons with custom hyperlink URLs or 規劃案例
    document.addEventListener('click', (e) => {
      const btn = e.target.closest('button');
      if (!btn || btn.closest('#btn-edit-modal')) return;
      const key = getButtonKey(btn);
      const cfg = customButtons[key];
      if (cfg && cfg.url) {
        e.preventDefault();
        e.stopImmediatePropagation();
        window.open(cfg.url, '_blank', 'noopener,noreferrer');
        return;
      }
      if (btn.dataset.action === 'planning-case') {
        e.preventDefault();
        e.stopImmediatePropagation();
        showToast('請按滑鼠右鍵指向「規劃案例」編輯超連結網址');
      }
    }, true);

    async function saveUpdatedHtmlFile() {
      persistCustomButtons();
      const embeddedEl = document.getElementById('embedded-button-config');
      if (embeddedEl) {
        embeddedEl.textContent = JSON.stringify(customButtons);
      }
      // Ensure modals are closed in the exported snapshot
      editModal.classList.add('hidden');
      editModal.classList.remove('flex');
      tocModal.classList.add('hidden');
      tocModal.classList.remove('flex');

      const fullHtml = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
      const blob = new Blob([fullHtml], { type: 'text/html;charset=utf-8' });

      if (window.showSaveFilePicker) {
        try {
          const handle = await window.showSaveFilePicker({
            suggestedName: 'wealth-transfer-presentation.html',
            types: [{ description: 'HTML 簡報檔', accept: { 'text/html': ['.html'] } }]
          });
          const writable = await handle.createWritable();
          await writable.write(blob);
          await writable.close();
          showToast('已成功覆蓋並儲存修改後的 HTML 檔案！');
          return;
        } catch (err) {
          if (err && err.name === 'AbortError') return;
        }
      }

      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'wealth-transfer-presentation.html';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      showToast('已另存並下載修改後的新 HTML 檔案！');
    }

    btnSaveHtml.addEventListener('click', saveUpdatedHtmlFile);

    loadCustomButtons();
    // =========================================================================
    // Initial render
    renderSlide();
    applyCustomButtonsToDOM();
  </script>
</body>
</html>
