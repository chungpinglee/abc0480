<!DOCTYPE html>
<html lang="zh-Hant" data-theme="pop">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>1151123主委及區經理會議摘要 — 動態簡報</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&family=Caveat:wght@600;700&family=Klee+One:wght@400;600&family=Long+Cang&family=Noto+Serif+TC:wght@600;700;900&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    /* =====================================================================
       BASE RESET & THEME VARIABLES
       ===================================================================== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --font-sans: 'Inter', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-display: 'Space Grotesk', 'Inter', 'Noto Sans TC', sans-serif;
      --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --anim-speed: 1s;
    }

    /* 1. 普普風 (Pop Art - Default) */
    html[data-theme="pop"] {
      --bg-page: #ffe600;
      --bg-stage: #fff3b0;
      --bg-card: #ffffff;
      --bg-card-alt: #00d2ff;
      --bg-badge: #ff2a85;
      --text-main: #111111;
      --text-muted: #333333;
      --text-accent: #ff2a85;
      --accent-1: #ff2a85;
      --accent-2: #00d2ff;
      --accent-danger: #ff2a2a;
      --accent-success: #00c853;
      --border-card: 3px solid #111111;
      --shadow-card: 6px 6px 0px #111111;
      --radius-card: 14px;
      --radius-pill: 999px;
      --btn-bg: #ff2a85;
      --btn-text: #ffffff;
      --btn-border: 3px solid #111111;
      --topbar-bg: #ffffff;
      --stage-pattern: radial-gradient(#111111 1.4px, transparent 1.4px);
      --stage-pattern-size: 16px 16px;
      --anim-speed: 1s;
    }

    /* 2. Apple 風 (Apple Minimalist Keynote) */
    html[data-theme="apple"] {
      --bg-page: #f5f5f7;
      --bg-stage: linear-gradient(180deg, #ffffff 0%, #f2f2f7 100%);
      --bg-card: rgba(255, 255, 255, 0.85);
      --bg-card-alt: #f5f5f7;
      --bg-badge: rgba(0, 113, 227, 0.1);
      --text-main: #1d1d1f;
      --text-muted: #6e6e73;
      --text-accent: #0071e3;
      --accent-1: #0071e3;
      --accent-2: #bf5af2;
      --accent-danger: #ff3b30;
      --accent-success: #34c759;
      --border-card: 1px solid rgba(0, 0, 0, 0.08);
      --shadow-card: 0 10px 30px rgba(0, 0, 0, 0.06);
      --radius-card: 20px;
      --radius-pill: 999px;
      --btn-bg: #0071e3;
      --btn-text: #ffffff;
      --btn-border: 1px solid transparent;
      --topbar-bg: rgba(255, 255, 255, 0.88);
      --stage-pattern: none;
      --stage-pattern-size: 0 0;
      --anim-speed: 1s;
    }

    /* 3. 瑞士風 (Swiss International Style) */
    html[data-theme="swiss"] {
      --bg-page: #eae8e1;
      --bg-stage: #f4f3ee;
      --bg-card: #ffffff;
      --bg-card-alt: #111111;
      --bg-badge: #e10600;
      --text-main: #111111;
      --text-muted: #4a4a4a;
      --text-accent: #e10600;
      --accent-1: #e10600;
      --accent-2: #111111;
      --accent-danger: #e10600;
      --accent-success: #0f7b3e;
      --border-card: 2px solid #111111;
      --shadow-card: none;
      --radius-card: 0px;
      --radius-pill: 0px;
      --btn-bg: #111111;
      --btn-text: #ffffff;
      --btn-border: 2px solid #111111;
      --topbar-bg: #f4f3ee;
      --stage-pattern: linear-gradient(to right, rgba(17,17,17,0.06) 1px, transparent 1px);
      --stage-pattern-size: 80px 100%;
      --anim-speed: 1s;
    }

    /* 4. 手繪風 (Hand-Drawn Sketchbook — 有機筆觸、紙膠帶、螢光筆劃線) */
    html[data-theme="sketch"] {
      --font-sans: 'Long Cang', 'Caveat', 'Klee One', 'Noto Sans TC', cursive, sans-serif;
      --font-display: 'Long Cang', 'Caveat', 'Klee One', 'Noto Sans TC', cursive, sans-serif;
      --bg-page: #efe7d6;
      --bg-stage: #fcf8ee;
      --bg-card: #fffdf7;
      --bg-card-alt: #fff4cc;
      --bg-badge: #ffe066;
      --text-main: #1b2436;
      --text-muted: #3d485e;
      --text-accent: #d9534f;
      --accent-1: #e05a47;
      --accent-2: #2b9388;
      --accent-danger: #c92a2a;
      --accent-success: #2b8a3e;
      --border-card: 2.5px solid #2d2b28;
      --shadow-card: 5px 6px 0px rgba(45, 43, 40, 0.22);
      --radius-card: 255px 15px 225px 15px / 15px 225px 15px 255px;
      --radius-pill: 18px 8px 20px 10px / 10px 18px 8px 16px;
      --btn-bg: #e05a47;
      --btn-text: #ffffff;
      --btn-border: 2.5px solid #2d2b28;
      --topbar-bg: rgba(252, 248, 238, 0.96);
      --stage-pattern: repeating-linear-gradient(0deg, transparent, transparent 27px, rgba(112, 138, 168, 0.14) 28px), radial-gradient(rgba(45, 43, 40, 0.08) 1px, transparent 1px);
      --stage-pattern-size: 100% 28px, 18px 18px;
      --anim-speed: 1s;
    }

    /* 7. 文青風 (Fresh Literary Editorial) */
    html[data-theme="literary"] {
      --font-sans: 'Noto Sans TC', 'Inter', sans-serif;
      --font-display: 'Noto Serif TC', 'Noto Sans TC', serif;
      --bg-page: #f2efe9;
      --bg-stage: linear-gradient(165deg, #fbfaf6 0%, #f3efe6 100%);
      --bg-card: rgba(255, 255, 255, 0.92);
      --bg-card-alt: #f7f4ec;
      --bg-badge: rgba(45, 106, 79, 0.1);
      --text-main: #2c3531;
      --text-muted: #64706a;
      --text-accent: #2d6a4f;
      --accent-1: #2d6a4f;
      --accent-2: #c97a40;
      --accent-danger: #b54747;
      --accent-success: #2d6a4f;
      --border-card: 1px solid rgba(45, 106, 79, 0.2);
      --shadow-card: 0 8px 26px rgba(44, 53, 49, 0.06);
      --radius-card: 16px;
      --radius-pill: 999px;
      --btn-bg: #2d6a4f;
      --btn-text: #ffffff;
      --btn-border: 1px solid #2d6a4f;
      --topbar-bg: rgba(251, 250, 246, 0.9);
      --stage-pattern: none;
      --stage-pattern-size: 0 0;
      --anim-speed: 1s;
    }

    /* 5. 包浩斯風 (Bauhaus) */
    html[data-theme="bauhaus"] {
      --bg-page: #e8e2d5;
      --bg-stage: #f2ede4;
      --bg-card: #ffffff;
      --bg-card-alt: #1d4ed8;
      --bg-badge: #eab308;
      --text-main: #18181b;
      --text-muted: #3f3f46;
      --text-accent: #d92b2b;
      --accent-1: #d92b2b;
      --accent-2: #1d4ed8;
      --accent-danger: #d92b2b;
      --accent-success: #15803d;
      --border-card: 3px solid #18181b;
      --shadow-card: 8px 8px 0px #eab308;
      --radius-card: 4px;
      --radius-pill: 999px;
      --btn-bg: #1d4ed8;
      --btn-text: #ffffff;
      --btn-border: 2.5px solid #18181b;
      --topbar-bg: #f2ede4;
      --stage-pattern: linear-gradient(rgba(24,24,27,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(24,24,27,0.05) 1px, transparent 1px);
      --stage-pattern-size: 48px 48px;
      --anim-speed: 1s;
    }

    /* 6. 科幻風 (Sci-Fi HUD) */
    html[data-theme="scifi"] {
      --bg-page: #050a14;
      --bg-stage: radial-gradient(circle at 50% 25%, #0e1d38 0%, #050a14 75%);
      --bg-card: rgba(13, 25, 48, 0.78);
      --bg-card-alt: rgba(18, 36, 66, 0.85);
      --bg-badge: rgba(0, 240, 255, 0.14);
      --text-main: #eef6ff;
      --text-muted: #93b0d4;
      --text-accent: #00f0ff;
      --accent-1: #00f0ff;
      --accent-2: #ffb800;
      --accent-danger: #ff4d6d;
      --accent-success: #00e699;
      --border-card: 1px solid rgba(0, 240, 255, 0.32);
      --shadow-card: 0 0 24px rgba(0, 240, 255, 0.12), inset 0 0 18px rgba(0, 240, 255, 0.05);
      --radius-card: 12px;
      --radius-pill: 6px;
      --btn-bg: rgba(0, 240, 255, 0.12);
      --btn-text: #00f0ff;
      --btn-border: 1px solid rgba(0, 240, 255, 0.45);
      --topbar-bg: rgba(5, 10, 20, 0.92);
      --stage-pattern: linear-gradient(rgba(0, 240, 255, 0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 240, 255, 0.04) 1px, transparent 1px);
      --stage-pattern-size: 36px 36px;
      --anim-speed: 1s;
    }

    body {
      font-family: var(--font-sans);
      background: var(--bg-page);
      color: var(--text-main);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      transition: background 0.35s ease, color 0.35s ease;
    }

    /* =====================================================================
       TOP BAR (RWD + PREV/NEXT + STYLE SWITCHER + GEAR ICON ONLY)
       ===================================================================== */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--topbar-bg);
      backdrop-filter: blur(14px);
      border-bottom: var(--border-card);
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .page-badge {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 0.88rem;
      padding: 6px 11px;
      background: var(--bg-card);
      border: var(--border-card);
      border-radius: var(--radius-pill);
      color: var(--text-main);
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    .nav-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 7px 13px;
      min-height: 36px;
      font-weight: 800;
      font-size: 0.84rem;
      background: var(--btn-bg);
      color: var(--btn-text);
      border: var(--btn-border);
      border-radius: var(--radius-pill);
      cursor: pointer;
      white-space: nowrap;
      transition: transform 0.18s ease, opacity 0.2s ease;
    }
    .nav-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    .nav-btn:not(:disabled):hover { transform: translateY(-1px); }

    .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 7px 11px;
      min-height: 36px;
      font-size: 0.84rem;
      font-weight: 700;
      background: var(--bg-card);
      color: var(--text-main);
      border: var(--border-card);
      border-radius: var(--radius-pill);
      cursor: pointer;
      transition: transform 0.18s ease, background 0.2s ease;
    }
    .icon-btn:hover { transform: translateY(-1px); }

    .style-switcher {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .style-pill {
      padding: 6px 11px;
      font-size: 0.8rem;
      font-weight: 700;
      border-radius: var(--radius-pill);
      border: var(--border-card);
      background: var(--bg-card);
      color: var(--text-main);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .style-pill .swatch {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
      border: 1px solid rgba(0,0,0,0.25);
      flex-shrink: 0;
    }
    .style-pill.active {
      background: var(--btn-bg);
      color: var(--btn-text);
      border: var(--btn-border);
      transform: scale(1.04);
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .gear-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      padding: 0;
      background: var(--btn-bg);
      color: var(--btn-text);
      border: var(--btn-border);
      border-radius: 50%;
      cursor: pointer;
      box-shadow: var(--shadow-card);
      transition: transform 0.2s ease, filter 0.2s ease;
    }
    .gear-btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.08);
    }
    .gear-btn svg {
      transition: transform 0.5s var(--ease-out-expo);
    }
    .gear-btn:hover svg {
      transform: rotate(90deg);
    }

    /* Locked standalone export mode hides switcher & gear */
    html[data-locked="true"] .style-switcher,
    html[data-locked="true"] .gear-btn {
      display: none !important;
    }

    /* =====================================================================
       FULL-SCREEN PRESENTATION STAGE (RWD, ONE SLIDE AT A TIME)
       ===================================================================== */
    .stage-wrapper {
      flex: 1;
      display: flex;
      align-items: stretch;
      justify-content: center;
      width: 100%;
    }

    .slide-stage {
      width: 100%;
      min-height: calc(100vh - 56px);
      min-height: calc(100dvh - 56px);
      background: var(--bg-stage);
      background-image: var(--stage-pattern);
      background-size: var(--stage-pattern-size);
      padding: clamp(16px, 2.5vw, 30px) clamp(14px, 3.5vw, 44px);
      position: relative;
      overflow-x: hidden;
      touch-action: pan-y;
      display: flex;
      flex-direction: column;
      justify-content: center;
      transition: background 0.35s ease;
    }

    .slide-inner {
      width: 100%;
      max-width: 1320px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: clamp(12px, 1.8vw, 18px);
      position: relative;
      z-index: 2;
    }

    /* Theme-specific subtle decorative accents */
    html[data-theme="bauhaus"] .slide-stage::before {
      content: "";
      position: absolute;
      top: -40px;
      right: -40px;
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: rgba(234, 179, 8, 0.25);
      pointer-events: none;
    }
    html[data-theme="pop"] .slide-stage::before {
      content: "POW!";
      position: absolute;
      bottom: 18px;
      right: 26px;
      font-family: var(--font-display);
      font-weight: 900;
      font-size: 2.6rem;
      color: rgba(255, 42, 133, 0.14);
      transform: rotate(-10deg);
      pointer-events: none;
    }
    html[data-theme="swiss"] .slide-stage::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 10px;
      height: 100%;
      background: #e10600;
      pointer-events: none;
    }

    /* =====================================================================
       SLIDE TYPOGRAPHY & CARDS
       ===================================================================== */
    .slide-header {
      position: relative;
      z-index: 2;
    }

    .slide-title {
      font-family: var(--font-display);
      font-size: clamp(1.35rem, 2.6vw, 2.3rem);
      font-weight: 900;
      line-height: 1.25;
      color: var(--text-main);
    }

    .slide-subtitle {
      margin-top: 5px;
      font-size: clamp(0.92rem, 1.2vw, 1.04rem);
      color: var(--text-muted);
      font-weight: 500;
    }

    .slide-body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: clamp(12px, 1.6vw, 16px);
      position: relative;
      z-index: 2;
    }

    .card {
      background: var(--bg-card);
      border: var(--border-card);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);
      padding: clamp(14px, 1.8vw, 20px) clamp(16px, 2vw, 22px);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .card:hover {
      transform: translateY(-3px);
    }
    html[data-theme="sketch"] .card { position: relative; }
    html[data-theme="sketch"] .card::before {
      content: "";
      position: absolute;
      top: -9px;
      left: 50%;
      width: 68px;
      height: 16px;
      transform: translateX(-50%) rotate(-2.5deg);
      background: rgba(255, 214, 102, 0.72);
      border: 1px dashed rgba(45, 43, 40, 0.35);
      pointer-events: none;
    }
    html[data-theme="sketch"] .card:nth-child(odd) { transform: rotate(-0.9deg); }
    html[data-theme="sketch"] .card:nth-child(even) { transform: rotate(0.85deg); }
    html[data-theme="sketch"] .card:hover { transform: rotate(0deg) translateY(-3px); }
    html[data-theme="sketch"] .slide-title {
      display: inline-block;
      background: linear-gradient(transparent 62%, rgba(255, 224, 102, 0.65) 62%);
      padding: 0 6px;
    }
    html[data-theme="sketch"] .pill-item {
      border-style: dashed;
      background: #fffaf0;
    }
    html[data-theme="sketch"] .slide-title,
    html[data-theme="sketch"] .slide-subtitle,
    html[data-theme="sketch"] .card,
    html[data-theme="sketch"] .banner-callout {
      letter-spacing: 0.03em;
      text-shadow: 0.25px 0.25px 0 rgba(27, 36, 54, 0.28);
    }

    .card-title {
      font-size: clamp(1rem, 1.3vw, 1.14rem);
      font-weight: 800;
      margin-bottom: 8px;
      color: var(--text-accent);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(12px, 1.8vw, 18px); }
    .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(12px, 1.8vw, 18px); }
    .grid-1-2 { display: grid; grid-template-columns: 1.05fr 1.35fr; gap: clamp(12px, 1.8vw, 18px); }

    .banner-callout {
      padding: clamp(12px, 1.5vw, 16px) clamp(14px, 2vw, 20px);
      border-radius: var(--radius-card);
      border: var(--border-card);
      background: var(--bg-card);
      box-shadow: var(--shadow-card);
      font-weight: 700;
      font-size: clamp(0.92rem, 1.15vw, 1.04rem);
      line-height: 1.55;
      border-left: 6px solid var(--accent-2);
    }
    .banner-callout.danger {
      border-left-color: var(--accent-danger);
    }

    .pill-item {
      padding: 9px 12px;
      border-radius: var(--radius-card);
      border: var(--border-card);
      background: var(--bg-stage);
      margin-bottom: 7px;
      font-size: clamp(0.86rem, 1.05vw, 0.95rem);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .pill-item:last-child { margin-bottom: 0; }

    .kpi-huge {
      font-family: var(--font-display);
      font-size: clamp(2.6rem, 5.5vw, 4.8rem);
      font-weight: 900;
      line-height: 1;
      color: var(--accent-1);
      margin-bottom: 8px;
    }
    .kpi-label {
      font-size: clamp(1.1rem, 1.6vw, 1.35rem);
      font-weight: 800;
      color: var(--text-main);
    }

    /* Animated Comparison Bar (Slide 5) */
    .bar-track {
      width: 100%;
      height: 12px;
      border-radius: 999px;
      background: rgba(128, 128, 128, 0.22);
      overflow: hidden;
      margin: 10px 0 12px;
    }
    .bar-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      /* width animated by GSAP */
    }

    /* =====================================================================
       DYNAMIC ENTRANCE ANIMATIONS (~1s, SEQUENTIAL FRAME APPEARANCE)
       ===================================================================== */
    @keyframes animFadeUp {
      from { opacity: 0; transform: translateY(28px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes animPopIn {
      0% { opacity: 0; transform: scale(0.78) rotate(-2.5deg); }
      70% { opacity: 1; transform: scale(1.03) rotate(0.8deg); }
      100% { opacity: 1; transform: scale(1) rotate(0deg); }
    }
    @keyframes animSwissSlide {
      from { opacity: 0; transform: translateX(-42px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes animPulseGlow {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.03); opacity: 0.9; }
    }
    @keyframes animSlowSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .anim-item {
      opacity: 0;
      will-change: transform, opacity;
    }

    .stage-progress-track {
      position: sticky;
      top: 0;
      width: 100%;
      height: 3px;
      background: rgba(128, 128, 128, 0.18);
      z-index: 49;
      overflow: hidden;
    }
    .stage-progress-fill {
      height: 100%;
      width: 0%;
      background: var(--accent-1);
      box-shadow: 0 0 8px var(--accent-1);
    }
    .autoplay-dwell-track {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: transparent;
      z-index: 60;
      pointer-events: none;
    }
    .autoplay-dwell-fill {
      height: 100%;
      width: 0%;
      background: var(--accent-2);
      opacity: 0.9;
    }
    .play-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 7px 12px;
      min-height: 36px;
      font-size: 0.82rem;
      font-weight: 800;
      background: var(--bg-card);
      color: var(--text-main);
      border: var(--border-card);
      border-radius: var(--radius-pill);
      cursor: pointer;
      white-space: nowrap;
      transition: transform 0.18s ease, background 0.2s ease, color 0.2s ease;
    }
    .play-btn:hover { transform: translateY(-1px); }
    .play-btn.is-playing {
      background: var(--btn-bg);
      color: var(--btn-text);
      border: var(--btn-border);
    }

    .pulse-alert {
      animation: animPulseGlow 2.2s infinite ease-in-out;
    }

    .ring-progress {
      /* stroke-dashoffset animated by GSAP */
    }

    .glory-orbit {
      transform-origin: 60px 60px;
      animation: animSlowSpin 18s linear infinite;
    }

    /* =====================================================================
       MODALS (PASSWORD + GEAR EXPORT)
       ===================================================================== */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.62);
      backdrop-filter: blur(6px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-backdrop.open { display: flex; }

    .modal-box {
      width: 100%;
      max-width: 520px;
      background: var(--bg-card);
      color: var(--text-main);
      border: var(--border-card);
      border-radius: var(--radius-card);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
      padding: 24px;
      position: relative;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .modal-title {
      font-size: 1.2rem;
      font-weight: 900;
    }
    .close-btn {
      background: transparent;
      border: var(--border-card);
      color: var(--text-main);
      width: 34px;
      height: 34px;
      border-radius: 50%;
      font-size: 1.1rem;
      font-weight: 800;
      cursor: pointer;
    }

    .pwd-input {
      width: 100%;
      padding: 11px 14px;
      font-size: 1rem;
      font-weight: 700;
      border: var(--border-card);
      border-radius: var(--radius-card);
      background: var(--bg-stage);
      color: var(--text-main);
      outline: none;
      margin-bottom: 10px;
    }
    .pwd-error {
      color: var(--accent-danger);
      font-size: 0.86rem;
      font-weight: 800;
      min-height: 20px;
      margin-bottom: 10px;
    }

    .export-option {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 12px 14px;
      border: var(--border-card);
      border-radius: var(--radius-card);
      margin-bottom: 12px;
      cursor: pointer;
      background: var(--bg-stage);
    }


    /* =====================================================================
       60FPS OPENING INTRO SPLASH (GSAP TIMELINE + SPLITTEXT)
       ===================================================================== */
    .intro-overlay {
      position: fixed;
      inset: 0;
      z-index: 300;
      background-color: var(--bg-page);
      background: var(--bg-stage);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      overflow: hidden;
      will-change: transform, opacity;
      cursor: pointer;
    }
    html[data-theme="pop"] .intro-overlay {
      background-color: #111111;
      background-image: radial-gradient(rgba(255, 230, 0, 0.18) 1.5px, transparent 1.5px);
      background-size: 22px 22px;
    }
    html[data-theme="swiss"] .intro-overlay,
    html[data-theme="sketch"] .intro-overlay,
    html[data-theme="bauhaus"] .intro-overlay {
      background-color: var(--bg-stage);
      background-image: var(--stage-pattern);
      background-size: var(--stage-pattern-size);
    }
    html[data-theme="scifi"] .intro-overlay {
      background-color: #050a14;
      background-image:
        linear-gradient(rgba(0, 240, 255, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.05) 1px, transparent 1px),
        radial-gradient(circle at 50% 25%, #0e1d38 0%, #050a14 75%);
      background-size: 36px 36px, 36px 36px, 100% 100%;
    }
    html[data-theme="apple"] .intro-overlay {
      background: linear-gradient(180deg, #ffffff 0%, #f2f2f7 100%);
    }
    html[data-theme="literary"] .intro-overlay {
      background: linear-gradient(165deg, #fbfaf6 0%, #f3efe6 100%);
    }
    .intro-burst {
      position: absolute;
      width: min(76vw, 520px);
      height: min(76vw, 520px);
      border-radius: 50%;
      background: var(--bg-card);
      border: var(--border-card);
      box-shadow: var(--shadow-card);
      z-index: 0;
      will-change: transform, opacity;
    }
    html[data-theme="pop"] .intro-burst {
      background: #ffe600;
      border: 6px solid #111111;
      box-shadow: 12px 12px 0 #ff2a85;
    }
    html[data-theme="scifi"] .intro-burst {
      background: rgba(0, 240, 255, 0.06);
      border: 2px solid #00f0ff;
      box-shadow: 0 0 60px rgba(0, 240, 255, 0.28), inset 0 0 40px rgba(0, 240, 255, 0.12);
    }
    html[data-theme="apple"] .intro-burst {
      background: radial-gradient(circle, rgba(0, 113, 227, 0.12) 0%, rgba(191, 90, 242, 0.08) 65%, transparent 100%);
      border: 1px solid rgba(0, 0, 0, 0.06);
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.06);
    }
    html[data-theme="swiss"] .intro-burst {
      border-radius: 0;
      border: 4px solid #111111;
      box-shadow: 14px 14px 0 #e10600;
    }
    html[data-theme="sketch"] .intro-burst {
      border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
      background: #fffdf7;
      border: 3px dashed #2d2b28;
      box-shadow: 8px 8px 0 rgba(224, 90, 71, 0.25);
    }
    html[data-theme="bauhaus"] .intro-burst {
      background: #eab308;
      border: 4px solid #18181b;
      box-shadow: 14px 14px 0 #1d4ed8;
    }
    html[data-theme="literary"] .intro-burst {
      background: rgba(45, 106, 79, 0.06);
      border: 1.5px solid rgba(45, 106, 79, 0.25);
      box-shadow: 0 18px 50px rgba(44, 53, 49, 0.06);
    }
    .intro-content {
      position: relative;
      z-index: 2;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .intro-badge {
      display: inline-block;
      padding: 10px 30px;
      background: var(--btn-bg);
      color: var(--btn-text);
      border: var(--btn-border);
      box-shadow: var(--shadow-card);
      border-radius: var(--radius-pill);
      font-family: var(--font-display);
      font-weight: 900;
      font-size: clamp(1.35rem, 3vw, 2.2rem);
      letter-spacing: 0.14em;
      will-change: transform, opacity;
    }
    html[data-theme="pop"] .intro-badge {
      background: #ff2a85;
      color: #ffffff;
      border: 3px solid #111111;
      box-shadow: 6px 6px 0 #111111;
    }
    .intro-title {
      font-family: var(--font-display);
      font-size: clamp(2rem, 5.2vw, 4.1rem);
      font-weight: 900;
      line-height: 1.2;
      color: var(--text-main);
      will-change: transform, opacity;
    }
    html[data-theme="pop"] .intro-title {
      color: #111111;
      text-shadow: 3px 3px 0 #ffffff;
    }
    html[data-theme="scifi"] .intro-title {
      color: #00f0ff;
      text-shadow: 0 0 18px rgba(0, 240, 255, 0.55);
    }
    .intro-bar {
      width: 120px;
      height: 6px;
      background: var(--accent-2);
      border: var(--border-card);
      border-radius: var(--radius-pill);
      will-change: transform, opacity;
    }
    .intro-sub {
      font-size: clamp(1rem, 2vw, 1.45rem);
      font-weight: 800;
      color: var(--text-main);
      background: var(--bg-card);
      padding: 8px 22px;
      border: var(--border-card);
      box-shadow: var(--shadow-card);
      border-radius: var(--radius-card);
      will-change: transform, opacity;
    }
    .intro-hint {
      margin-top: 10px;
      padding: 7px 18px;
      font-size: 0.9rem;
      font-weight: 800;
      color: var(--btn-text);
      background: var(--btn-bg);
      border: var(--btn-border);
      border-radius: var(--radius-pill);
      opacity: 0;
      will-change: transform, opacity;
    }
    html[data-theme="pop"] .intro-hint {
      color: #ffe600;
      background: #111111;
      border: 2px solid #ffe600;
    }
    .intro-skip {
      position: absolute;
      bottom: 22px;
      right: 22px;
      z-index: 3;
      padding: 8px 14px;
      font-size: 0.82rem;
      font-weight: 800;
      background: var(--bg-card);
      color: var(--text-main);
      border: var(--border-card);
      border-radius: var(--radius-pill);
      cursor: pointer;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #111827;
      color: #ffffff;
      padding: 12px 18px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.9rem;
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px);
      transition: all 0.25s ease;
    }
    .toast.show { opacity: 1; transform: translateY(0); }

    /* =====================================================================
       RWD BREAKPOINTS (TABLET & MOBILE)
       ===================================================================== */
    @media (max-width: 960px) {
      .grid-2, .grid-3, .grid-1-2 { grid-template-columns: 1fr; }
      .topbar { padding: 8px 12px; gap: 8px; }
      .style-switcher { order: 3; width: 100%; justify-content: flex-start; overflow-x: auto; flex-wrap: nowrap; padding-bottom: 2px; }
      .topbar-right { margin-left: auto; }
    }

    @media (max-width: 540px) {
      .nav-btn { padding: 6px 10px; font-size: 0.8rem; }
      .page-badge { font-size: 0.8rem; padding: 5px 9px; }
      .style-pill { padding: 5px 10px; font-size: 0.78rem; }
      .slide-stage { justify-content: flex-start; padding-top: 18px; padding-bottom: 26px; }
    }
  </style>
</head>
<body>
  <!-- 60FPS OPENING INTRO OVERLAY -->
  <div class="intro-overlay" id="introOverlay" role="presentation">
    <div class="intro-burst" id="introBurst"></div>
    <div class="intro-content">
      <div class="intro-badge" id="introBadge">1151123</div>
      <h1 class="intro-title" id="introTitle">主委及區經理會議摘要</h1>
      <div class="intro-bar" id="introBar"></div>
      <p class="intro-sub" id="introSub">聚焦榮耀 · 精準佈局 · 團隊共贏</p>
      <div class="intro-hint" id="introHint">點擊螢幕任意處進入簡報 ➔</div>
    </div>
    <button class="intro-skip" id="btnSkipIntro" type="button">Skip ⏭</button>
  </div>
  <!-- TOP BAR: PREV/NEXT ON LEFT, 6 STYLES IN CENTER, FULLSCREEN + GEAR ICON ON RIGHT -->
  <header class="topbar">
    <div class="topbar-left">
      <button class="icon-btn" id="btnHome" type="button" aria-label="回首頁" style="width:36px; height:36px; padding:0;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
      </button>
      <span class="page-badge" id="pageCounter">01 / 14</span>
    </div>

    <nav class="style-switcher" id="styleSwitcher" aria-label="簡報風格選擇">
      <button class="style-pill active" data-set-theme="pop" type="button"><span class="swatch" style="background:#ffe600"></span>普普風</button>
      <button class="style-pill" data-set-theme="scifi" type="button"><span class="swatch" style="background:#00f0ff"></span>科幻風</button>
      <button class="style-pill" data-set-theme="apple" type="button"><span class="swatch" style="background:#0071e3"></span>Apple 風</button>
      <button class="style-pill" data-set-theme="swiss" type="button"><span class="swatch" style="background:#e10600"></span>瑞士風</button>
      <button class="style-pill" data-set-theme="sketch" type="button"><span class="swatch" style="background:#e05a47"></span>手繪風</button>
      <button class="style-pill" data-set-theme="bauhaus" type="button"><span class="swatch" style="background:#eab308"></span>包浩斯風</button>
      <button class="style-pill" data-set-theme="literary" type="button"><span class="swatch" style="background:#2d6a4f"></span>文青風</button>
    </nav>

    <div class="topbar-right">
      <button class="play-btn" id="btnAutoPlay" type="button" title="切換自動播放模式 (快捷鍵 P)">▶ 自動播放</button>
      <button class="icon-btn" id="btnFullscreen" type="button" title="切換瀏覽器全螢幕">⛶</button>
      <button class="gear-btn" id="btnGearExport" type="button" aria-label="設定與匯出">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </div>
  </header>

  <!-- VIDEO PROGRESS BAR -->
  <div class="stage-progress-track" aria-hidden="true">
    <div class="stage-progress-fill" id="stageProgressFill"></div>
  </div>
  <div class="autoplay-dwell-track" aria-hidden="true">
    <div class="autoplay-dwell-fill" id="autoplayDwellFill"></div>
  </div>

  <!-- FULL-SCREEN PRESENTATION STAGE -->
  <main class="stage-wrapper">
    <section class="slide-stage" id="slideStage" aria-live="polite"></section>
  </main>

  <!-- PASSWORD MODAL (NO HINT) -->
  <div class="modal-backdrop" id="pwdModal" role="dialog" aria-modal="true">
    <div class="modal-box" style="max-width:380px;">
      <div class="modal-header">
        <h2 class="modal-title">請輸入密碼</h2>
        <button class="close-btn" id="btnClosePwd" type="button">✕</button>
      </div>
      <form id="pwdForm">
        <input class="pwd-input" id="pwdInput" type="password" autocomplete="off" />
        <div class="pwd-error" id="pwdError"></div>
        <button class="nav-btn" type="submit" style="width:100%; padding:10px;">確認</button>
      </form>
    </div>
  </div>

  <!-- GEAR EXPORT MODAL -->
  <div class="modal-backdrop" id="exportModal" role="dialog" aria-modal="true">
    <div class="modal-box">
      <div class="modal-header">
        <h2 class="modal-title">⚙ 產生專屬風格動態簡報</h2>
        <button class="close-btn" id="btnCloseExport" type="button">✕</button>
      </div>
      <p style="color:var(--text-muted); font-size:0.94rem; margin-bottom:14px; line-height:1.6;">
        您目前選定的簡報風格為：<strong id="exportThemeName" style="color:var(--text-accent);">普普風 (Pop Art)</strong>。<br/>
        點擊下方按鈕，即可立即產生並下載該風格的獨立 HTML 動態簡報檔案，雙擊即可離線播放！
      </p>
      <label class="export-option">
        <input type="radio" name="exportMode" value="locked" checked style="margin-top:4px;" />
        <div>
          <div style="font-weight:800;">純淨簡報版（推薦）</div>
          <div style="font-size:0.84rem; color:var(--text-muted);">鎖定為目前所選風格，並隱藏上方風格切換器與齒輪按鈕，直接作為正式簡報使用。</div>
        </div>
      </label>
      <label class="export-option">
        <input type="radio" name="exportMode" value="editable" style="margin-top:4px;" />
        <div>
          <div style="font-weight:800;">保留切換器版本</div>
          <div style="font-size:0.84rem; color:var(--text-muted);">以目前風格為預設開啟，但保留右上角齒輪與風格切換列供日後調整。</div>
        </div>
      </label>
      <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:18px;">
        <button class="nav-btn" id="btnDownloadHtml" type="button" style="flex:1; justify-content:center; padding:10px 18px;">⬇ 下載獨立動態簡報 (.html)</button>
        <button class="icon-btn" id="btnCopyHtml" type="button">📋 複製 HTML 程式碼</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- Official GSAP + SplitText + ScrambleTextPlugin (Inlined for 100% Offline Playback) -->
  <script>

          tl.from(split.chars, {

      }

      if (subtitleEl) {
        tl.fromTo(subtitleEl, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.45, ease: 'power2.out' }, 0.18);
      }

      const titleEl = stageEl.querySelector('.slide-title');

      const nextIdx = Math.max(0, Math.min(SLIDES.length - 1, idx));

      stopAutoPlayDwell();

      if (!hasRenderedOnce || !stageEl.querySelector('.slide-inner')) {

        onComplete: () => mountAndPlaySlide(nextIdx, direction)

        scale: 0.97,
        duration: 0.24,
        stagger: 0.03,
        ease: 'power2.in'

      const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `1151123主委及區經理會議摘要_${THEME_META[themeKey].fileSlug}.html`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      exportModal.classList.remove('open');
      showToast(`已產生並下載「${THEME_META[themeKey].fileSlug}」動態簡報！`);
    });

    document.getElementById('btnCopyHtml').addEventListener('click', () => {
      const mode = document.querySelector('input[name="exportMode"]:checked').value;
      const html = buildStandaloneHtml(mode);
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(html).then(() => showToast('已複製完整 HTML 程式碼！')).catch(() => fallbackCopy(html));
      } else {
        fallbackCopy(html);
      }
    });

    function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        showToast('已複製完整 HTML 程式碼！');
      } catch (err) {
        showToast('複製失敗，請改用下載按鈕。');
      }
      ta.remove();
    }

    btnFullscreen.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => showToast('目前環境不支援全螢幕切換'));
      } else {
        document.exitFullscreen().catch(() => {});
      }
    });

    // Touch swipe (Swipe Left = Prev, Swipe Right = Next) + Tap anywhere on stage to advance
    let touchStartX = 0;
    let touchStartY = 0;
    let justSwiped = false;
    document.addEventListener('touchstart', e => {
      if (pwdModal.classList.contains('open') || exportModal.classList.contains('open')) return;
      if (e.target.closest('.topbar')) return;
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, { passive: true });
    document.addEventListener('touchend', e => {
      if (pwdModal.classList.contains('open') || exportModal.classList.contains('open')) return;
      if (e.target.closest('.topbar')) return;
      const dx = e.changedTouches[0].screenX - touchStartX;
      const dy = e.changedTouches[0].screenY - touchStartY;
      if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.2) {
        justSwiped = true;
        setTimeout(() => { justSwiped = false; }, 350);
        if (dx < 0 && currentIndex > 0) renderSlide(currentIndex - 1);
        else if (dx > 0 && currentIndex < SLIDES.length - 1) renderSlide(currentIndex + 1);
      }
    }, { passive: true });

    stageEl.addEventListener('mousemove', e => {
      if (!parallaxX || !parallaxY) return;
      const rect = stageEl.getBoundingClientRect();
      const nx = (e.clientX - rect.left) / rect.width - 0.5;
      const ny = (e.clientY - rect.top) / rect.height - 0.5;
      parallaxX(nx * -14);
      parallaxY(ny * -9);
      if (headerParallaxX && headerParallaxY) {
        headerParallaxX(nx * -6);
        headerParallaxY(ny * -4);
      }
    });
    stageEl.addEventListener('mouseleave', () => {
      if (parallaxX) parallaxX(0);
      if (parallaxY) parallaxY(0);
      if (headerParallaxX) headerParallaxX(0);
      if (headerParallaxY) headerParallaxY(0);
    });

    stageEl.addEventListener('click', e => {
      if (justSwiped) return;
      if (pwdModal.classList.contains('open') || exportModal.classList.contains('open')) return;
      if (e.target.closest('button, a, input, label, .modal-box, .topbar')) return;
      if (currentIndex < SLIDES.length - 1) renderSlide(currentIndex + 1);
    });

    document.addEventListener('keydown', e => {
      if (pwdModal.classList.contains('open')) {
        if (e.key === 'Escape') pwdModal.classList.remove('open');
        return;
      }
      if (exportModal.classList.contains('open')) {
        if (e.key === 'Escape') exportModal.classList.remove('open');
        return;
      }
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') {
        e.preventDefault();
        if (currentIndex < SLIDES.length - 1) renderSlide(currentIndex + 1);
      } else if (e.key === 'p' || e.key === 'P') {
        e.preventDefault();
        setAutoPlay(!isAutoPlaying);
      } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
        e.preventDefault();
        if (currentIndex > 0) renderSlide(currentIndex - 1);
      }
    });

    document.getElementById('btnHome').addEventListener('click', () => { setAutoPlay(false); playOpeningIntro(); });
    btnAutoPlay.addEventListener('click', () => setAutoPlay(!isAutoPlaying));

    // 60fps Theme-Adaptive Opening Intro (repayable via Home button)
    let introState = {
      active: false,
      exiting: false,
      tl: null,
      hintTween: null,
      split: null,
      mm: null,
      bound: false
    };

    function playOpeningIntro() {
      const overlay = document.getElementById('introOverlay');
      const burst = document.getElementById('introBurst');
      const badge = document.getElementById('introBadge');
      const titleEl = document.getElementById('introTitle');
      const bar = document.getElementById('introBar');
      const sub = document.getElementById('introSub');
      const hintEl = document.getElementById('introHint');
      const skipBtn = document.getElementById('btnSkipIntro');

      const activeTheme = document.documentElement.getAttribute('data-theme') || 'pop';
      document.documentElement.setAttribute('data-theme', activeTheme);
      document.querySelectorAll('.style-pill').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.setTheme === activeTheme);
      });
      exportThemeNameEl.textContent = THEME_META[activeTheme].name;

      if (!overlay) {
        renderSlide(0, 1);
        return;
      }

      // Clean up any prior intro run
      if (introState.hintTween) introState.hintTween.kill();
      if (introState.tl) introState.tl.kill();
      if (introState.split && introState.split.revert) introState.split.revert();
      if (introState.mm && introState.mm.revert) introState.mm.revert();
      gsap.killTweensOf(overlay);

      titleEl.textContent = '主委及區經理會議摘要';
      introState.active = true;
      introState.exiting = false;
      introState.split = null;

      gsap.set('.stage-wrapper', { autoAlpha: 0 });
      gsap.set(overlay, { display: 'flex', autoAlpha: 1, yPercent: 0, clearProps: 'transform' });
      gsap.set([burst, badge, bar, sub, hintEl], { clearProps: 'transform,opacity,visibility' });

      function finishAndShowSlide() {
        if (!introState.active) return;
        introState.active = false;
        introState.exiting = false;
        if (introState.hintTween) introState.hintTween.kill();
        if (introState.tl) introState.tl.kill();
        if (introState.split && introState.split.revert) introState.split.revert();
        gsap.set(overlay, { autoAlpha: 0, display: 'none' });
        gsap.set('.stage-wrapper', { autoAlpha: 1 });
        hasRenderedOnce = false;
        renderSlide(0, 1);
      }

      function exitToPresentation(immediate) {
        if (!introState.active || introState.exiting) return;
        introState.exiting = true;
        if (introState.hintTween) introState.hintTween.kill();
        if (introState.tl) introState.tl.kill();
        if (immediate) {
          finishAndShowSlide();
          return;
        }
        gsap.set('.stage-wrapper', { autoAlpha: 1 });
        gsap.to(overlay, {
          yPercent: -100,
          duration: 0.6,
          ease: 'power4.inOut',
          onComplete: finishAndShowSlide
        });
      }

      if (!introState.bound) {
        introState.bound = true;
        skipBtn.addEventListener('click', e => {
          e.stopPropagation();
          exitToPresentation(true);
        });
        overlay.addEventListener('click', () => exitToPresentation(false));
        document.addEventListener('keydown', e => {
          if (!introState.active || introState.exiting) return;
          if (e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowRight') {
            e.preventDefault();
            e.stopPropagation();
            exitToPresentation(false);
          }
        }, true);
      }

      const profile = THEME_MOTION_PROFILE[activeTheme] || THEME_MOTION_PROFILE.pop;
      introState.mm = gsap.matchMedia();
      introState.mm.add(
        {
          reduceMotion: '(prefers-reduced-motion: reduce)',
          fullMotion: '(prefers-reduced-motion: no-preference)'
        },
        (context) => {
          if (context.conditions.reduceMotion) {
            finishAndShowSlide();
            return;
          }

          const tl = gsap.timeline({
            defaults: { ease: 'power3.out' },
            onComplete: () => {
              if (hintEl && introState.active && !introState.exiting) {
                introState.hintTween = gsap.to(hintEl, {
                  y: -4,
                  duration: 1.1,
                  yoyo: true,
                  repeat: -1,
                  ease: 'sine.inOut'
                });
              }
            }
          });
          introState.tl = tl;

          // Theme-adapted Burst / Backdrop shape
          const burstFrom = activeTheme === 'swiss'
            ? { scaleX: 0.2, scaleY: 0.2, rotation: 0, autoAlpha: 0 }
            : { scale: 0.25, rotation: activeTheme === 'scifi' ? -60 : -25, autoAlpha: 0 };
          tl.fromTo(
            burst,
            burstFrom,
            { scale: 1, scaleX: 1, scaleY: 1, rotation: 0, autoAlpha: 1, duration: 0.72, ease: profile.itemEase },
            0
          );

          // Enlarged 1151123 Badge
          tl.fromTo(
            badge,
            { y: -26, scale: 0.78, autoAlpha: 0 },
            { y: 0, scale: 1, autoAlpha: 1, duration: 0.5, ease: 'back.out(1.7)' },
            0.16
          );

          // Theme-adapted Title Reveal (Scramble for Sci-Fi, SplitText chars for others)
          if (activeTheme === 'scifi' && typeof ScrambleTextPlugin !== 'undefined') {
            const orig = titleEl.textContent;
            tl.fromTo(titleEl, { autoAlpha: 0, scale: 0.96 }, { autoAlpha: 1, scale: 1, duration: 0.3 }, 0.28);
            tl.to(titleEl, {
              duration: 0.85,
              scrambleText: { text: orig, chars: '01▲▼◆█░', revealDelay: 0.15, speed: 0.55 },
              ease: 'none'
            }, 0.28);
          } else if (typeof SplitText !== 'undefined') {
            introState.split = SplitText.create(titleEl, { type: 'chars', mask: 'chars' });
            const charFrom = activeTheme === 'swiss'
              ? { xPercent: -110, autoAlpha: 0 }
              : activeTheme === 'apple' || activeTheme === 'literary'
                ? { yPercent: 95, autoAlpha: 0 }
                : { yPercent: 115, rotation: () => gsap.utils.random(-8, 8), autoAlpha: 0 };
            tl.from(
              introState.split.chars,
              Object.assign(charFrom, {
                duration: 0.56,
                stagger: 0.032,
                ease: activeTheme === 'apple' ? 'power4.out' : 'back.out(1.5)'
              }),
              0.3
            );
          } else {
            tl.fromTo(titleEl, { y: 26, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.5 }, 0.3);
          }

          // Accent Bar (scaleX for 60fps compositor)
          tl.fromTo(
            bar,
            { scaleX: 0, autoAlpha: 0, transformOrigin: 'center center' },
            { scaleX: 1, autoAlpha: 1, duration: 0.42, ease: 'power3.out' },
            0.72
          );

          // Subtitle Card
          tl.fromTo(
            sub,
            { y: 22, scale: 0.94, autoAlpha: 0 },
            { y: 0, scale: 1, autoAlpha: 1, duration: 0.48, ease: 'back.out(1.4)' },
            0.85
          );

          // Click-to-enter Hint
          if (hintEl) {
            tl.fromTo(
              hintEl,
              { y: 14, autoAlpha: 0 },
              { y: 0, autoAlpha: 1, duration: 0.45, ease: 'power2.out' },
              '-=0.1'
            );
          }
        }
      );
    }

    playOpeningIntro();
  </script>
</body>
</html>
