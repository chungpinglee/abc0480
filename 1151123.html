<!DOCTYPE html>
<html lang="zh-Hant" data-theme="pop">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>1151123主委及區經理會議摘要 — 動態簡報</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    /* =====================================================================
       BASE RESET & THEME VARIABLES
       ===================================================================== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --font-sans: 'Inter', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-display: 'Space Grotesk', 'Inter', 'Noto Sans TC', sans-serif;
      --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --anim-speed: 1s;
    }

    /* 1. 普普風 (Pop Art - Default) */
    html[data-theme="pop"] {
      --bg-page: #ffe600;
      --bg-stage: #fff3b0;
      --bg-card: #ffffff;
      --bg-card-alt: #00d2ff;
      --bg-badge: #ff2a85;
      --text-main: #111111;
      --text-muted: #333333;
      --text-accent: #ff2a85;
      --accent-1: #ff2a85;
      --accent-2: #00d2ff;
      --accent-danger: #ff2a2a;
      --accent-success: #00c853;
      --border-card: 3px solid #111111;
      --shadow-card: 6px 6px 0px #111111;
      --radius-card: 14px;
      --radius-pill: 999px;
      --btn-bg: #ff2a85;
      --btn-text: #ffffff;
      --btn-border: 3px solid #111111;
      --topbar-bg: #ffffff;
      --stage-pattern: radial-gradient(#111111 1.4px, transparent 1.4px);
      --stage-pattern-size: 16px 16px;
      --anim-speed: 1s;
    }

    /* 2. Apple 風 (Apple Minimalist Keynote) */
    html[data-theme="apple"] {
      --bg-page: #f5f5f7;
      --bg-stage: linear-gradient(180deg, #ffffff 0%, #f2f2f7 100%);
      --bg-card: rgba(255, 255, 255, 0.85);
      --bg-card-alt: #f5f5f7;
      --bg-badge: rgba(0, 113, 227, 0.1);
      --text-main: #1d1d1f;
      --text-muted: #6e6e73;
      --text-accent: #0071e3;
      --accent-1: #0071e3;
      --accent-2: #bf5af2;
      --accent-danger: #ff3b30;
      --accent-success: #34c759;
      --border-card: 1px solid rgba(0, 0, 0, 0.08);
      --shadow-card: 0 10px 30px rgba(0, 0, 0, 0.06);
      --radius-card: 20px;
      --radius-pill: 999px;
      --btn-bg: #0071e3;
      --btn-text: #ffffff;
      --btn-border: 1px solid transparent;
      --topbar-bg: rgba(255, 255, 255, 0.88);
      --stage-pattern: none;
      --stage-pattern-size: 0 0;
      --anim-speed: 1s;
    }

    /* 3. 瑞士風 (Swiss International Style) */
    html[data-theme="swiss"] {
      --bg-page: #eae8e1;
      --bg-stage: #f4f3ee;
      --bg-card: #ffffff;
      --bg-card-alt: #111111;
      --bg-badge: #e10600;
      --text-main: #111111;
      --text-muted: #4a4a4a;
      --text-accent: #e10600;
      --accent-1: #e10600;
      --accent-2: #111111;
      --accent-danger: #e10600;
      --accent-success: #0f7b3e;
      --border-card: 2px solid #111111;
      --shadow-card: none;
      --radius-card: 0px;
      --radius-pill: 0px;
      --btn-bg: #111111;
      --btn-text: #ffffff;
      --btn-border: 2px solid #111111;
      --topbar-bg: #f4f3ee;
      --stage-pattern: linear-gradient(to right, rgba(17,17,17,0.06) 1px, transparent 1px);
      --stage-pattern-size: 80px 100%;
      --anim-speed: 1s;
    }

    /* 4. 手繪風 (Hand-Drawn Sketchbook) */
    html[data-theme="sketch"] {
      --bg-page: #f3ede2;
      --bg-stage: #fdfbf7;
      --bg-card: #ffffff;
      --bg-card-alt: #fff8dc;
      --bg-badge: #ffd166;
      --text-main: #2b2d42;
      --text-muted: #5c6078;
      --text-accent: #e76f51;
      --accent-1: #e76f51;
      --accent-2: #2a9d8f;
      --accent-danger: #d62828;
      --accent-success: #2a9d8f;
      --border-card: 2.5px dashed #3d405b;
      --shadow-card: 4px 5px 0px rgba(61, 64, 91, 0.18);
      --radius-card: 18px 22px 16px 24px;
      --radius-pill: 14px 18px 12px 16px;
      --btn-bg: #e76f51;
      --btn-text: #ffffff;
      --btn-border: 2px solid #2b2d42;
      --topbar-bg: rgba(253, 251, 247, 0.96);
      --stage-pattern: radial-gradient(rgba(61, 64, 91, 0.14) 1px, transparent 1px);
      --stage-pattern-size: 20px 20px;
      --anim-speed: 1s;
    }

    /* 5. 包浩斯風 (Bauhaus) */
    html[data-theme="bauhaus"] {
      --bg-page: #e8e2d5;
      --bg-stage: #f2ede4;
      --bg-card: #ffffff;
      --bg-card-alt: #1d4ed8;
      --bg-badge: #eab308;
      --text-main: #18181b;
      --text-muted: #3f3f46;
      --text-accent: #d92b2b;
      --accent-1: #d92b2b;
      --accent-2: #1d4ed8;
      --accent-danger: #d92b2b;
      --accent-success: #15803d;
      --border-card: 3px solid #18181b;
      --shadow-card: 8px 8px 0px #eab308;
      --radius-card: 4px;
      --radius-pill: 999px;
      --btn-bg: #1d4ed8;
      --btn-text: #ffffff;
      --btn-border: 2.5px solid #18181b;
      --topbar-bg: #f2ede4;
      --stage-pattern: linear-gradient(rgba(24,24,27,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(24,24,27,0.05) 1px, transparent 1px);
      --stage-pattern-size: 48px 48px;
      --anim-speed: 1s;
    }

    /* 6. 科幻風 (Sci-Fi HUD) */
    html[data-theme="scifi"] {
      --bg-page: #050a14;
      --bg-stage: radial-gradient(circle at 50% 25%, #0e1d38 0%, #050a14 75%);
      --bg-card: rgba(13, 25, 48, 0.78);
      --bg-card-alt: rgba(18, 36, 66, 0.85);
      --bg-badge: rgba(0, 240, 255, 0.14);
      --text-main: #eef6ff;
      --text-muted: #93b0d4;
      --text-accent: #00f0ff;
      --accent-1: #00f0ff;
      --accent-2: #ffb800;
      --accent-danger: #ff4d6d;
      --accent-success: #00e699;
      --border-card: 1px solid rgba(0, 240, 255, 0.32);
      --shadow-card: 0 0 24px rgba(0, 240, 255, 0.12), inset 0 0 18px rgba(0, 240, 255, 0.05);
      --radius-card: 12px;
      --radius-pill: 6px;
      --btn-bg: rgba(0, 240, 255, 0.12);
      --btn-text: #00f0ff;
      --btn-border: 1px solid rgba(0, 240, 255, 0.45);
      --topbar-bg: rgba(5, 10, 20, 0.92);
      --stage-pattern: linear-gradient(rgba(0, 240, 255, 0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 240, 255, 0.04) 1px, transparent 1px);
      --stage-pattern-size: 36px 36px;
      --anim-speed: 1s;
    }

    body {
      font-family: var(--font-sans);
      background: var(--bg-page);
      color: var(--text-main);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      transition: background 0.35s ease, color 0.35s ease;
    }

    /* =====================================================================
       TOP BAR (RWD + PREV/NEXT + STYLE SWITCHER + GEAR ICON ONLY)
       ===================================================================== */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--topbar-bg);
      backdrop-filter: blur(14px);
      border-bottom: var(--border-card);
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .page-badge {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 0.88rem;
      padding: 6px 11px;
      background: var(--bg-card);
      border: var(--border-card);
      border-radius: var(--radius-pill);
      color: var(--text-main);
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    .nav-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 7px 13px;
      min-height: 36px;
      font-weight: 800;
      font-size: 0.84rem;
      background: var(--btn-bg);
      color: var(--btn-text);
      border: var(--btn-border);
      border-radius: var(--radius-pill);
      cursor: pointer;
      white-space: nowrap;
      transition: transform 0.18s ease, opacity 0.2s ease;
    }
    .nav-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    .nav-btn:not(:disabled):hover { transform: translateY(-1px); }

    .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 7px 11px;
      min-height: 36px;
      font-size: 0.84rem;
      font-weight: 700;
      background: var(--bg-card);
      color: var(--text-main);
      border: var(--border-card);
      border-radius: var(--radius-pill);
      cursor: pointer;
      transition: transform 0.18s ease, background 0.2s ease;
    }
    .icon-btn:hover { transform: translateY(-1px); }

    .style-switcher {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .style-pill {
      padding: 6px 11px;
      font-size: 0.8rem;
      font-weight: 700;
      border-radius: var(--radius-pill);
      border: var(--border-card);
      background: var(--bg-card);
      color: var(--text-main);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .style-pill .swatch {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
      border: 1px solid rgba(0,0,0,0.25);
      flex-shrink: 0;
    }
    .style-pill.active {
      background: var(--btn-bg);
      color: var(--btn-text);
      border: var(--btn-border);
      transform: scale(1.04);
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .gear-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      padding: 0;
      background: var(--btn-bg);
      color: var(--btn-text);
      border: var(--btn-border);
      border-radius: 50%;
      cursor: pointer;
      box-shadow: var(--shadow-card);
      transition: transform 0.2s ease, filter 0.2s ease;
    }
    .gear-btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.08);
    }
    .gear-btn svg {
      transition: transform 0.5s var(--ease-out-expo);
    }
    .gear-btn:hover svg {
      transform: rotate(90deg);
    }

    /* Locked standalone export mode hides switcher & gear */
    html[data-locked="true"] .style-switcher,
    html[data-locked="true"] .gear-btn {
      display: none !important;
    }

    /* =====================================================================
       FULL-SCREEN PRESENTATION STAGE (RWD, ONE SLIDE AT A TIME)
       ===================================================================== */
    .stage-wrapper {
      flex: 1;
      display: flex;
      align-items: stretch;
      justify-content: center;
      width: 100%;
    }

    .slide-stage {
      width: 100%;
      min-height: calc(100vh - 56px);
      min-height: calc(100dvh - 56px);
      background: var(--bg-stage);
      background-image: var(--stage-pattern);
      background-size: var(--stage-pattern-size);
      padding: clamp(16px, 2.5vw, 30px) clamp(14px, 3.5vw, 44px);
      position: relative;
      overflow-x: hidden;
      touch-action: pan-y;
      display: flex;
      flex-direction: column;
      justify-content: center;
      transition: background 0.35s ease;
    }

    .slide-inner {
      width: 100%;
      max-width: 1320px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: clamp(12px, 1.8vw, 18px);
      position: relative;
      z-index: 2;
    }

    /* Theme-specific subtle decorative accents */
    html[data-theme="bauhaus"] .slide-stage::before {
      content: "";
      position: absolute;
      top: -40px;
      right: -40px;
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: rgba(234, 179, 8, 0.25);
      pointer-events: none;
    }
    html[data-theme="pop"] .slide-stage::before {
      content: "POW!";
      position: absolute;
      bottom: 18px;
      right: 26px;
      font-family: var(--font-display);
      font-weight: 900;
      font-size: 2.6rem;
      color: rgba(255, 42, 133, 0.14);
      transform: rotate(-10deg);
      pointer-events: none;
    }
    html[data-theme="swiss"] .slide-stage::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 10px;
      height: 100%;
      background: #e10600;
      pointer-events: none;
    }

    /* =====================================================================
       SLIDE TYPOGRAPHY & CARDS
       ===================================================================== */
    .slide-header {
      position: relative;
      z-index: 2;
    }

    .slide-title {
      font-family: var(--font-display);
      font-size: clamp(1.35rem, 2.6vw, 2.3rem);
      font-weight: 900;
      line-height: 1.25;
      color: var(--text-main);
    }

    .slide-subtitle {
      margin-top: 5px;
      font-size: clamp(0.92rem, 1.2vw, 1.04rem);
      color: var(--text-muted);
      font-weight: 500;
    }

    .slide-body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: clamp(12px, 1.6vw, 16px);
      position: relative;
      z-index: 2;
    }

    .card {
      background: var(--bg-card);
      border: var(--border-card);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);
      padding: clamp(14px, 1.8vw, 20px) clamp(16px, 2vw, 22px);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .card:hover {
      transform: translateY(-3px);
    }
    html[data-theme="sketch"] .card:nth-child(odd) { transform: rotate(-0.4deg); }
    html[data-theme="sketch"] .card:nth-child(even) { transform: rotate(0.4deg); }
    html[data-theme="sketch"] .card:hover { transform: rotate(0deg) translateY(-3px); }

    .card-title {
      font-size: clamp(1rem, 1.3vw, 1.14rem);
      font-weight: 800;
      margin-bottom: 8px;
      color: var(--text-accent);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(12px, 1.8vw, 18px); }
    .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(12px, 1.8vw, 18px); }
    .grid-1-2 { display: grid; grid-template-columns: 1.05fr 1.35fr; gap: clamp(12px, 1.8vw, 18px); }

    .banner-callout {
      padding: clamp(12px, 1.5vw, 16px) clamp(14px, 2vw, 20px);
      border-radius: var(--radius-card);
      border: var(--border-card);
      background: var(--bg-card);
      box-shadow: var(--shadow-card);
      font-weight: 700;
      font-size: clamp(0.92rem, 1.15vw, 1.04rem);
      line-height: 1.55;
      border-left: 6px solid var(--accent-2);
    }
    .banner-callout.danger {
      border-left-color: var(--accent-danger);
    }

    .pill-item {
      padding: 9px 12px;
      border-radius: var(--radius-card);
      border: var(--border-card);
      background: var(--bg-stage);
      margin-bottom: 7px;
      font-size: clamp(0.86rem, 1.05vw, 0.95rem);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .pill-item:last-child { margin-bottom: 0; }

    .kpi-huge {
      font-family: var(--font-display);
      font-size: clamp(2.6rem, 5.5vw, 4.8rem);
      font-weight: 900;
      line-height: 1;
      color: var(--accent-1);
      margin-bottom: 8px;
    }
    .kpi-label {
      font-size: clamp(1.1rem, 1.6vw, 1.35rem);
      font-weight: 800;
      color: var(--text-main);
    }

    /* Animated Comparison Bar (Slide 5) */
    .bar-track {
      width: 100%;
      height: 12px;
      border-radius: 999px;
      background: rgba(128, 128, 128, 0.22);
      overflow: hidden;
      margin: 10px 0 12px;
    }
    .bar-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      transition: width 1s var(--ease-out-expo);
    }

    /* =====================================================================
       DYNAMIC ENTRANCE ANIMATIONS (~1s, SEQUENTIAL FRAME APPEARANCE)
       ===================================================================== */
    @keyframes animFadeUp {
      from { opacity: 0; transform: translateY(28px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes animPopIn {
      0% { opacity: 0; transform: scale(0.78) rotate(-2.5deg); }
      70% { opacity: 1; transform: scale(1.03) rotate(0.8deg); }
      100% { opacity: 1; transform: scale(1) rotate(0deg); }
    }
    @keyframes animSwissSlide {
      from { opacity: 0; transform: translateX(-42px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes animPulseGlow {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.03); opacity: 0.9; }
    }
    @keyframes animSlowSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .anim-item {
      opacity: 0;
    }
    .slide-stage.is-animating .anim-item {
      animation: animFadeUp var(--anim-speed) var(--ease-out-expo) forwards;
      animation-delay: calc(var(--stagger, 0) * 260ms);
    }
    html[data-theme="pop"] .slide-stage.is-animating .anim-item {
      animation-name: animPopIn;
      animation-timing-function: var(--ease-spring);
    }
    html[data-theme="swiss"] .slide-stage.is-animating .anim-item {
      animation-name: animSwissSlide;
    }

    .pulse-alert {
      animation: animPulseGlow 2.2s infinite ease-in-out;
    }

    .ring-progress {
      transition: stroke-dashoffset 1s var(--ease-out-expo);
    }

    .glory-orbit {
      transform-origin: 60px 60px;
      animation: animSlowSpin 18s linear infinite;
    }

    /* =====================================================================
       MODALS (PASSWORD + GEAR EXPORT)
       ===================================================================== */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.62);
      backdrop-filter: blur(6px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-backdrop.open { display: flex; }

    .modal-box {
      width: 100%;
      max-width: 520px;
      background: var(--bg-card);
      color: var(--text-main);
      border: var(--border-card);
      border-radius: var(--radius-card);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
      padding: 24px;
      position: relative;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .modal-title {
      font-size: 1.2rem;
      font-weight: 900;
    }
    .close-btn {
      background: transparent;
      border: var(--border-card);
      color: var(--text-main);
      width: 34px;
      height: 34px;
      border-radius: 50%;
      font-size: 1.1rem;
      font-weight: 800;
      cursor: pointer;
    }

    .pwd-input {
      width: 100%;
      padding: 11px 14px;
      font-size: 1rem;
      font-weight: 700;
      border: var(--border-card);
      border-radius: var(--radius-card);
      background: var(--bg-stage);
      color: var(--text-main);
      outline: none;
      margin-bottom: 10px;
    }
    .pwd-error {
      color: var(--accent-danger);
      font-size: 0.86rem;
      font-weight: 800;
      min-height: 20px;
      margin-bottom: 10px;
    }

    .export-option {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 12px 14px;
      border: var(--border-card);
      border-radius: var(--radius-card);
      margin-bottom: 12px;
      cursor: pointer;
      background: var(--bg-stage);
    }

    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #111827;
      color: #ffffff;
      padding: 12px 18px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.9rem;
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px);
      transition: all 0.25s ease;
    }
    .toast.show { opacity: 1; transform: translateY(0); }

    /* =====================================================================
       RWD BREAKPOINTS (TABLET & MOBILE)
       ===================================================================== */
    @media (max-width: 960px) {
      .grid-2, .grid-3, .grid-1-2 { grid-template-columns: 1fr; }

    function showToast(msg) {
      toastEl.textContent = msg;

      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => toastEl.classList.remove('show'), 2600);
    }

    function animateCountersAndRings() {
      stageEl.querySelectorAll('[data-count]').forEach(el => {
        const target = parseFloat(el.dataset.count);
        const prefix = el.dataset.prefix || '';
        const suffix = el.dataset.suffix || '';
        const duration = 1000;
        const start = performance.now();
        function step(now) {
          const p = Math.min((now - start) / duration, 1);
          const eased = 1 - Math.pow(1 - p, 3);
          const val = Math.round(target * eased);
          el.textContent = `${prefix}${val}${suffix}`;
          if (p < 1) requestAnimationFrame(step);
          else el.textContent = `${prefix}${target}${suffix}`;
        }
        requestAnimationFrame(step);
      });

      requestAnimationFrame(() => {
        stageEl.querySelectorAll('.ring-progress').forEach(circle => {
          const targetOffset = circle.getAttribute('data-target-offset');
          setTimeout(() => {
            circle.style.strokeDashoffset = targetOffset;
          }, 160);
        });
        stageEl.querySelectorAll('.bar-fill').forEach(bar => {
          const targetWidth = bar.getAttribute('data-target-width');
          setTimeout(() => {
            bar.style.width = targetWidth;
          }, 200);
        });
      });
    }

    function renderSlide(idx) {
      currentIndex = Math.max(0, Math.min(SLIDES.length - 1, idx));
      const s = SLIDES[currentIndex];

      stageEl.innerHTML = `

          <div class="slide-body">${s.render()}</div>
        </div>

      void stageEl.offsetWidth;
      stageEl.classList.add('is-animating');

      counterEl.textContent = `${String(currentIndex + 1).padStart(2, '0')} / ${SLIDES.length}`;


      animateCountersAndRings();
    }

    function setTheme(themeKey) {
      if (!THEME_META[themeKey]) return;
      document.documentElement.setAttribute('data-theme', themeKey);

      exportThemeNameEl.textContent = THEME_META[themeKey].name;
      renderSlide(currentIndex);

      const themeKey = document.documentElement.getAttribute('data-theme') || 'pop';

      if (mode === 'locked') {
        clone.setAttribute('data-locked', 'true');
      } else {

      const clonedPwdModal = clone.querySelector('#pwdModal');
      const clonedStage = clone.querySelector('#slideStage');
      if (clonedExportModal) clonedExportModal.classList.remove('open');

      if (clonedStage) clonedStage.innerHTML = '';
      return '<!DOCTYPE html>\n' + clone.outerHTML;

        return;
      }
      if (exportModal.classList.contains('open')) {
        if (e.key === 'Escape') exportModal.classList.remove('open');
        return;
      }
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') {
        e.preventDefault();
        if (currentIndex < SLIDES.length - 1) renderSlide(currentIndex + 1);
      } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
        e.preventDefault();
        if (currentIndex > 0) renderSlide(currentIndex - 1);
      }
    });

    // Init
    const initialTheme = document.documentElement.getAttribute('data-theme') || 'pop';
    setTheme(initialTheme);
  </script>
</body>
</html>
